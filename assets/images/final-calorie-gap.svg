<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chart of daily calorie supply from 1961 to 2023 showing the best fed and worst fed country in each year. The best fed country stays near or above 3,500 calories while the worst fed stays below 2,100. The ratio between them narrows from 3.0 to 1 in 1961 to 2.2 to 1 in 2023 but the gap never closes.">
