<svg viewBox="0 0 1128 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chart of daily calorie supply from 1961 to 2023 showing the best fed and worst fed country in each year. In 1961 the extremes were Jordan at 4,064 calories and Burkina Faso at 1,339, a ratio of 3.0 to 1. In 2023 they were the United States at 3,947 and Yemen at 1,811, a ratio of 2.2 to 1. The band between the two lines narrows slowly but never closes.">
