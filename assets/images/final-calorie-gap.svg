 .src{fill:#8b94a3;font:11px system-ui,-apple-system,Segoe UI,sans-serif}
 @media (prefers-color-scheme:dark){.bg{fill:#0f141c}.t{fill:#e7eef7}.sub{fill:#94a1b2}
 .grid{stroke:#223047}.axis{stroke:#33415a}.tick{fill:#94a1b2}.ann{fill:#94a1b2}.src{fill:#6b7688}}
</style>
