<svg viewBox="0 0 1128 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Line chart from 1961 to 2023 of the average distance between the diets of 133 countries and four reference plates fixed at their 1961 composition. Distance to the Western plate falls 30 percent, the only line that falls substantially. Distance to the South Asian and East Asian plates rises about 15 percent and distance to the West African plate stays flat. The world moved toward one plate and away from the others.">
<style>
