<svg viewBox="0 0 780 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Horizontal bar chart of the fourteen most frequent correspondents in Founders Online after removing duplicate records. Thomas Jefferson leads with 42,349 letters sent plus received and George Washington follows with 38,142. Two women appear: Abigail Adams seventh with 4,109 and Louisa Catherine Johnson Adams twelfth with 1,120. Both are members of the Adams family.">
