<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two aligned charts covering 1961 to 2023. The top chart shows dietary dissimilarity between countries falling steadily by two independent measures. The bottom chart shows the daily calorie supply of the best and worst fed countries, with the wide gap between them persisting across the entire period.">
