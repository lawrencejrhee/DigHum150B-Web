<svg viewBox="0 0 800 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Small multiple chart of twelve countries, each showing its dietary composition as two horizontal stacked bars, one for 1961 and one for the most recent year, 2023 for all countries except Japan which ends in 2022. In 1961 the bars differ sharply between countries; staple plants dominate Asian and African plates while Western plates already show large shares of oils, sugar, meat and dairy. By 2023 nearly every plate has shifted toward the Western pattern and the bars look far more alike.">
