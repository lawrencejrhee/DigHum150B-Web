<svg viewBox="0 0 1128 1302" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Twelve countries shown as pairs of stacked bars, their diets in 1961 and in the most recent year, as shares of daily calories. Beside each bar is the share coming from oils, sugar, meat and dairy, the Western pattern. In 1961 that number is 64 for the United States but only 7 for South Korea and 10 for China. By 2023 South Korea reaches 54, China 33, and Brazil 57, while Nigeria and Senegal barely move. The plates converge toward the Western pattern.">
